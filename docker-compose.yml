services:
  servicepilot:
    build: .
    ports:
      - "127.0.0.1:8770:8770"
    environment:
      ENABLE_OLLAMA: "${ENABLE_OLLAMA:-0}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "qwen3.5:9b"
    volumes:
      - servicepilot-data:/app/data
    restart: unless-stopped

volumes:
  servicepilot-data:
